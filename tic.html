<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(120deg, #8e2de2, #4a00e0);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }

    .form-box input {
      padding: 10px;
      margin: 10px 5px;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
    }

    .form-box button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background-color: #fff;
      color: #4a00e0;
      cursor: pointer;
      transition: background 0.3s;
    }

    .form-box button:hover {
      background-color: #ddd;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 5px;
      justify-content: center;
      position: relative;
      margin: 20px auto;
    }

    .cell {
      background: #ffffff10;
      border: 2px solid #fff;
      font-size: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .cell:hover {
      background-color: #ffffff30;
    }

    .cell.win {
      background-color: #4aff78;
      color: #000;
    }

    #status {
      font-size: 1.2rem;
      margin: 10px 0;
    }

    #resetBtn {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background-color: #fff;
      color: #4a00e0;
      cursor: pointer;
      transition: background 0.3s;
    }

    #resetBtn:hover {
      background-color: #ddd;
    }

    .win-line {
      position: absolute;
      height: 4px;
      background-color: #00ffcc;
      transform-origin: center;
      z-index: 1;
      transition: all 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>

    <!-- Name Input Form -->
    <div id="nameForm" class="form-box">
      <input type="text" id="player1" placeholder="Enter Player 1 Name">
      <input type="text" id="player2" placeholder="Enter Player 2 Name">
      <button onclick="startGame()">Start Game</button>
    </div>

    <!-- Game Board -->
    <div class="game-area" style="display: none;">
      <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
        <div id="winLine" class="win-line" style="display: none;"></div>
      </div>
      <p id="status"></p>
      <button id="resetBtn" onclick="resetGame()">Restart Game</button>
    </div>
  </div>

  <script>
    let currentPlayer = 'X';
    let board = ['', '', '', '', '', '', '', '', ''];
    let player1 = '';
    let player2 = '';

    const nameForm = document.getElementById('nameForm');
    const gameArea = document.querySelector('.game-area');
    const statusText = document.getElementById('status');
    const boardEl = document.getElementById('board');
    const winLine = document.getElementById('winLine');

    function startGame() {
      player1 = document.getElementById('player1').value.trim();
      player2 = document.getElementById('player2').value.trim();

      if (!player1 || !player2) {
        alert("Please enter both player names.");
        return;
      }

      nameForm.style.display = 'none';
      gameArea.style.display = 'block';
      updateStatus();
    }

    function updateStatus() {
      const currentName = currentPlayer === 'X' ? player1 : player2;
      statusText.textContent = `${currentName}'s Turn (${currentPlayer})`;
    }

    function highlightWinningLine(combo) {
      const linePos = {
        '0,1,2': { top: '50px', left: '0', width: '310px', rotate: '0deg' },
        '3,4,5': { top: '155px', left: '0', width: '310px', rotate: '0deg' },
        '6,7,8': { top: '260px', left: '0', width: '310px', rotate: '0deg' },
        '0,3,6': { top: '0', left: '50px', width: '310px', rotate: '90deg' },
        '1,4,7': { top: '0', left: '155px', width: '310px', rotate: '90deg' },
        '2,5,8': { top: '0', left: '260px', width: '310px', rotate: '90deg' },
        '0,4,8': { top: '0', left: '0', width: '440px', rotate: '45deg' },
        '2,4,6': { top: '0', left: '0', width: '440px', rotate: '-45deg' }
      };
      const key = combo.join(',');
      const pos = linePos[key];
      if (pos) {
        winLine.style.top = pos.top;
        winLine.style.left = pos.left;
        winLine.style.width = pos.width;
        winLine.style.transform = `rotate(${pos.rotate})`;
        winLine.style.display = 'block';
      }
    }

    function checkWinner() {
      const winCombos = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      for (let combo of winCombos) {
        const [a, b, c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          highlightWinningLine(combo);
          return board[a];
        }
      }
      return board.includes('') ? null : 'Draw';
    }

    function handleClick(e) {
      const index = e.target.dataset.index;
      if (!index || board[index] || checkWinner()) return;

      board[index] = currentPlayer;
      e.target.textContent = currentPlayer;

      const winner = checkWinner();
      if (winner) {
        if (winner === 'Draw') {
          statusText.textContent = "It's a draw!";
        } else {
          const winnerName = winner === 'X' ? player1 : player2;
          statusText.textContent = `🎉 Congratulations ${winnerName}, You Win! 🎉`;
        }
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateStatus();
      }
    }

    function resetGame() {
      board = ['', '', '', '', '', '', '', '', ''];
      currentPlayer = 'X';
      boardEl.querySelectorAll('.cell').forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('win');
      });
      winLine.style.display = 'none';
      updateStatus();
    }

    document.querySelectorAll('.cell').forEach(cell => {
      cell.addEventListener('click', handleClick);
    });
  </script>
</body>
</html>
